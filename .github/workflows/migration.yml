name: Migration Regression Tests

on:
  workflow_dispatch:

jobs:
  migration:
    name: Migration (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      ENV_GATE_USERNAME: ${{ secrets.ENV_GATE_USERNAME }}
      ENV_GATE_PASSWORD: ${{ secrets.ENV_GATE_PASSWORD }}
      HEADLESS: 'true'
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run migration suite
        run: npm run test:migration -- --project=chromium

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-migration
          path: playwright-report/
          retention-days: 30
