name: Regression Tests

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Browser project to run (chromium, firefox, webkit, or all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - chromium
          - firefox
          - webkit

jobs:
  regression:
    name: Regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      ENV_GATE_USERNAME: ${{ secrets.ENV_GATE_USERNAME }}
      ENV_GATE_PASSWORD: ${{ secrets.ENV_GATE_PASSWORD }}
      HEADLESS: 'true'
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: |
          if [ "${{ github.event.inputs.project }}" = "all" ]; then
            npx playwright install --with-deps
          else
            npx playwright install --with-deps ${{ github.event.inputs.project }}
          fi

      - name: Run regression tests
        run: |
          if [ "${{ github.event.inputs.project }}" = "all" ]; then
            npm run test:regression
          else
            npm run test:regression -- --project=${{ github.event.inputs.project }}
          fi

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-regression
          path: playwright-report/
          retention-days: 30
